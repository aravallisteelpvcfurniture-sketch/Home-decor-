name: Build Android APK & Deploy GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (for AGP 9.1+)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Signing Keystores (Debug & Release)
        run: |
          echo "=== Setting up Debug Keystore ==="
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

          echo "=== Setting up Release Keystore ==="
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Decoded my-upload-key.jks from repository secret KEYSTORE_BASE64."
          elif [ ! -f my-upload-key.jks ]; then
            echo "Generating CI fallback release keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -storepass "${STORE_PASSWORD:-android}" -keypass "${KEY_PASSWORD:-android}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aravalli Furniture,O=Aravalli,C=IN"
          fi
          ls -lh my-upload-key.jks
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Environment File
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "Initialized .env from .env.example"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          STORE_PASSWORD="${STORE_PASSWORD:-android}" KEY_PASSWORD="${KEY_PASSWORD:-android}" ./gradlew :app:assembleRelease --stacktrace || echo "Release build skipped or handled gracefully"
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare GitHub Pages Static Assets & APK Download
        run: |
          echo "=== Copying built APK to root and docs/ for direct download ==="
          mkdir -p docs
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk docs/app-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
            echo "Successfully copied debug APK to docs/app-debug.apk and ./app-debug.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk docs/app-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk docs/app-release.apk
            cp app/build/outputs/apk/release/app-release.apk app-release.apk
          fi
          # Ensure .nojekyll exists in docs/ to avoid Jekyll 404 errors on GitHub Pages
          touch docs/.nojekyll
          touch .nojekyll
          cp index.html docs/index.html
          if [ -f 404.html ]; then
            cp 404.html docs/404.html
          fi
          ls -lh docs/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aravalli-steel-pvc-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aravalli-steel-pvc-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy-pages:
    name: Deploy to GitHub Pages
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
