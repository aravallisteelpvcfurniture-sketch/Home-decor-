name: Build Android APK & Deploy Pages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Prepare Environment Configuration
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "Initialized .env from .env.example"
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --info

      - name: Verify and Package APKs for Download
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK generated successfully:"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            mkdir -p docs
            cp app/build/outputs/apk/debug/app-debug.apk docs/app-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          else
            echo "Error: app/build/outputs/apk/debug/app-debug.apk was not found!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aravalli-furniture-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Check and Build Release APK (Conditional on Keystore)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Release keystore decoded from KEYSTORE_BASE64 secret."
          fi
          if [ -f my-upload-key.jks ] || [ -n "${{ secrets.KEYSTORE_PATH }}" ]; then
            echo "Building Release APK with signing configuration..."
            ./gradlew :app:assembleRelease --stacktrace
          else
            echo "Notice: Release keystore 'my-upload-key.jks' is not present in repository or secrets."
            echo "Skipping release packaging. Debug APK was successfully built and tested."
          fi
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aravalli-furniture-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            app/build/reports/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy-pages:
    name: Deploy to GitHub Pages
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
